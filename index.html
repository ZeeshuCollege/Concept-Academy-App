<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Concept Academy" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Concept Academy - Better Learning, Bigger Dreams</title>
    <meta name="description" content="Closed digital management ecosystem for Concept Academy offline students, parents, faculty, and administrators." />
    <!-- Google Fonts: Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var errDiv = document.getElementById('runtime-error-display');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'runtime-error-display';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:16px;z-index:999999;font-family:sans-serif;font-size:13px;white-space:pre-wrap;';
          document.body.prepend(errDiv);
        }
        errDiv.textContent += '\nError: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
